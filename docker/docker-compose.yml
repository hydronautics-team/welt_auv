services:
  control:
    build:
      context: ..
      dockerfile: docker/control/Dockerfile
    image: ${CONTROL_IMAGE:-hydronautics/welt_auv:control}
    container_name: welt_auv_control
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
    command: ros2 launch stingray_planning mission_pool_test.launch.py

  gate-test:
    build:
      context: ..
      dockerfile: docker/control/Dockerfile
    image: ${CONTROL_IMAGE:-hydronautics/welt_auv:control}
    container_name: welt_auv_gate_test
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    profiles: [gate-test]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: >-
      ros2 launch sauvc_missions gate_sauvc_2027.launch.py
      control_data_topic:=${GATE_CONTROL_TOPIC:-/control/data_test}

  sim-mission:
    build:
      context: ..
      dockerfile: docker/control/Dockerfile
    image: ${CONTROL_IMAGE:-hydronautics/welt_auv:control}
    container_name: welt_auv_sim_mission
    network_mode: host
    ipc: host
    restart: unless-stopped
    profiles: [simulator]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: >-
      ros2 launch sauvc_missions gate_sim.launch.py
      synthetic_detections:=${SIM_SYNTHETIC_DETECTIONS:-true}

  sim-yolo:
    build:
      context: ..
      dockerfile: docker/od/Dockerfile.cpu
    image: ${YOLO_SIM_IMAGE:-hydronautics/welt_auv:yolo-cpu}
    container_name: welt_auv_sim_yolo
    network_mode: host
    ipc: host
    restart: unless-stopped
    profiles: [simulator-yolo]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      YOLO_WEIGHTS_PATH: /models/yolov8.pt
    volumes:
      - ${YOLO_WEIGHTS:-../src/sauvc/src/sauvc_object_detection/weights/yolov8.pt}:/models/yolov8.pt:ro
      - /etc/localtime:/etc/localtime:ro
    command: >-
      ros2 launch welt_launch yolo.launch.py
      weights_path:=/models/yolov8.pt
      debug:=${YOLO_DEBUG:-True}
      image_topic:=/stingray/topics/camera/front
      camera_info_topic:=/stingray/topics/camera/front/camera_info
      enabled_on_start:=True

  yolo:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/od/Dockerfile
      args:
        YOLO_BASE_IMAGE: ${YOLO_BASE_IMAGE:-hydronautics/od:l4t-r36.3.0}
    image: ${YOLO_IMAGE:-hydronautics/welt_auv:yolo}
    container_name: welt_auv_yolo
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    gpus: all
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      YOLO_WEIGHTS_PATH: /models/yolov8.pt
    volumes:
      - /dev/shm:/dev/shm
      - ${YOLO_WEIGHTS:-../src/sauvc/src/sauvc_object_detection/weights/yolov8.pt}:/models/yolov8.pt:ro
      - /etc/localtime:/etc/localtime:ro
    command: >-
      ros2 launch welt_launch yolo.launch.py
      weights_path:=/models/yolov8.pt
      debug:=${YOLO_DEBUG:-False}
      image_topic:=${FRONT_CAMERA_IMAGE_TOPIC:-/zed/zed_node/rgb/color/rect/image}
      camera_info_topic:=${FRONT_CAMERA_INFO_TOPIC:-/zed/zed_node/rgb/color/rect/camera_info}
      enabled_on_start:=${YOLO_ENABLED_ON_START:-True}

  front-camera:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/od/Dockerfile
      args:
        YOLO_BASE_IMAGE: ${YOLO_BASE_IMAGE:-hydronautics/od:l4t-r36.3.0}
    image: ${YOLO_IMAGE:-hydronautics/welt_auv:yolo}
    container_name: welt_auv_front_camera
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    profiles: [usb-camera]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
    command: >-
      ros2 run stingray_cam usb_camera --ros-args
      -p video_device:=${USB_CAMERA_DEVICE:-/dev/video0}
      -p image_topic:=/stingray/topics/camera/front
      -p camera_info_topic:=/stingray/topics/camera/front/camera_info
      -p camera_info_url:=/welt_auv/install/stingray_cam/share/stingray_cam/configs/camera.yaml
      -p image_width:=${USB_CAMERA_WIDTH:-640}
      -p image_height:=${USB_CAMERA_HEIGHT:-480}
      -p framerate:=${USB_CAMERA_FPS:-30.0}

  zed:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/zed/Dockerfile
      args:
        ZED_BASE_IMAGE: ${ZED_BASE_IMAGE:-stereolabs/zed:5.5-devel-l4t-r36.5}
        ZED_WRAPPER_REF: ${ZED_WRAPPER_REF:-master}
    image: ${ZED_IMAGE:-hydronautics/welt_auv:zed}
    container_name: welt_auv_zed
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    gpus: all
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ${DISPLAY}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /usr/local/zed/resources:/usr/local/zed/resources
      - /usr/local/zed/settings:/usr/local/zed/settings
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >-
      ros2 launch zed_wrapper zed_camera.launch.py
      camera_model:=${ZED_CAMERA_MODEL:-zedm}
