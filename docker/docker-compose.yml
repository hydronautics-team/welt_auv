services:
  control:
    build:
      context: ..
      dockerfile: docker/control/Dockerfile
    image: ${CONTROL_IMAGE:-hydronautics/welt_auv:control}
    container_name: welt_auv_control
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
    command: ros2 launch stingray_planning planning.launch.py

  yolo:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/od/Dockerfile
      args:
        YOLO_BASE_IMAGE: ${YOLO_BASE_IMAGE:-hydronautics/od:l4t-r36.3.0}
    image: ${YOLO_IMAGE:-hydronautics/welt_auv:yolo}
    container_name: welt_auv_yolo
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    gpus: all
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      YOLO_WEIGHTS_PATH: /models/yolov8.pt
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ${YOLO_WEIGHTS:-/opt/welt/models/yolov8.pt}:/models/yolov8.pt:ro
      - /etc/localtime:/etc/localtime:ro
    command: >-
      ros2 launch welt_launch yolo.launch.py
      weights_path:=/models/yolov8.pt
      image_topic_list:=${YOLO_IMAGE_TOPIC_LIST:-[/zed/zed_node/rgb/color/rect/image,/stingray/topics/camera/bottom]}
      camera_info_topic_list:=${YOLO_CAMERA_INFO_TOPIC_LIST:-[/zed/zed_node/rgb/color/rect/camera_info,/stingray/topics/camera/bottom/camera_info]}
      enable_bottom_camera:=${ENABLE_BOTTOM_CAMERA:-True}
      bottom_camera_device:=${BOTTOM_CAMERA_DEVICE:-/dev/video2}
      debug:=${YOLO_DEBUG:-False}

  zed:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/zed/Dockerfile
      args:
        ZED_BASE_IMAGE: ${ZED_BASE_IMAGE:-stereolabs/zed:5.5-devel-l4t-r36.5}
        ZED_WRAPPER_REF: ${ZED_WRAPPER_REF:-master}
    image: ${ZED_IMAGE:-hydronautics/welt_auv:zed}
    container_name: welt_auv_zed
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    gpus: all
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /usr/local/zed/resources:/usr/local/zed/resources:ro
      - /usr/local/zed/settings:/usr/local/zed/settings
      - /etc/localtime:/etc/localtime:ro
    command: ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zedm
